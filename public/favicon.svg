<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <!-- Neon Core Gradient for R -->
    <linearGradient id="r-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="r-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <!-- Blur filters for premium glow -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer ambient glow -->
  <rect x="44" y="44" width="424" height="424" rx="100" fill="none" stroke="url(#glow-grad)" stroke-width="16" filter="url(#glow-heavy)" opacity="0.4" />

  <!-- Premium glass dark background -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="#09090b" stroke="url(#glow-grad)" stroke-width="5" />
  
  <!-- Subtle inner card border highlight for glass effect -->
  <rect x="52" y="52" width="408" height="408" rx="92" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.08" />

  <!-- Harmonic vector waves background (Resonance) -->
  <g opacity="0.25">
    <path d="M 80 256 C 140 180, 200 332, 256 256 C 312 180, 372 332, 432 256" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
    <path d="M 80 286 C 130 340, 190 200, 256 286 C 322 372, 382 232, 432 286" fill="none" stroke="#d946ef" stroke-width="3" stroke-linecap="round" />
    <path d="M 80 226 C 150 180, 210 280, 256 226 C 302 172, 362 272, 432 226" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Styled Glowing 'R' with custom path matching the generated artwork -->
  <g filter="url(#glow-heavy)">
    <!-- Glow layer behind R -->
    <path d="M 180 145 C 220 145, 290 140, 315 170 C 345 205, 320 250, 280 260 M 180 145 L 180 365 M 180 260 C 220 260, 285 255, 310 295 C 335 335, 335 350, 345 365" 
          fill="none" 
          stroke="url(#r-glow-grad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.8" />
  </g>
  <g filter="url(#glow-subtle)">
    <!-- Core high-contrast R outline -->
    <path d="M 180 145 C 220 145, 290 140, 315 170 C 345 205, 320 250, 280 260 M 180 145 L 180 365 M 180 260 C 220 260, 285 255, 310 295 C 335 335, 335 350, 345 365" 
          fill="none" 
          stroke="url(#r-grad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- White center pipe core for hyper-modern neon look -->
    <path d="M 180 145 C 220 145, 290 140, 315 170 C 345 205, 320 250, 280 260 M 180 145 L 180 365 M 180 260 C 220 260, 285 255, 310 295 C 335 335, 335 350, 345 365" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.9" />
  </g>
</svg>
